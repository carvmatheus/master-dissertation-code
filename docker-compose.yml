services:
  chat:
    build: .
    image: master-dissertation-code:latest
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ../_local_repo/00-master-thesis-overleaf-help:/data:ro
      - ./.cache:/cache
    stdin_open: true
    tty: true
    command: ["python", "01-context-extension-comparison/chat.py", "--context-file", "/data/Chapters/002Revision/Revision.tex"]

  test:
    build: .
    image: master-dissertation-code:latest
    environment:
      GROQ_API_KEY: fake-key-for-tests
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ./.cache:/cache
    command: ["pytest", "tests/", "-v", "--tb=short"]

  # ============================================================
  # BENCHMARKS
  # ============================================================

  # ============================================================
  # RULER ISOLADO — reexecução com rate limit controlado
  # Rodar na ordem: 120b → 70b → 20b → 8b
  # ============================================================

  ruler-gpt120b:
    build: .
    image: master-dissertation-code:latest
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ./.cache:/cache
      - ./benchmark_ruler_results:/app/master-dissertation-code/benchmark_ruler_results
    command: >
      python 01-context-extension-comparison/run_benchmarks.py
      --strategies raw,sliding_window,parallel_window,semantic_compression,rig
      --benchmarks ruler
      --models openai/gpt-oss-120b
      --output-dir ./benchmark_ruler_results

  ruler-llama70b:
