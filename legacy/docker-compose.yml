services:
  chat:
    build: .
    image: master-dissertation-code:latest
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ../_local_repo/00-master-thesis-overleaf-help:/data:ro
      - ./.cache:/cache
    stdin_open: true
    tty: true
    command: ["python", "01-context-extension-comparison/chat.py", "--context-file", "/data/Chapters/002Revision/Revision.tex"]

  test:
    build: .
    image: master-dissertation-code:latest
    environment:
      GROQ_API_KEY: fake-key-for-tests
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ./.cache:/cache
    command: ["pytest", "tests/", "-v", "--tb=short"]

  # ============================================================
  # GROQ — serviço genérico (sobrescreva o comando conforme precisar)
  # docker compose run --rm groq python groq_run/run_groq.py --model llama-3.3-70b-versatile --benchmark babilong
  # ============================================================
  groq:
    build: .
    image: master-dissertation-code:latest
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ./.cache:/cache
      - ./groq_results:/app/master-dissertation-code/groq_results
    working_dir: /app/master-dissertation-code
    command: ["python", "groq_run/run_groq.py"]

  groq-quick:
    build: .
    image: master-dissertation-code:latest
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
    volumes:
      - ./.cache:/cache
      - ./groq_results:/app/master-dissertation-code/groq_results
